name: VSCode Extension

# Runs on dev as well as mainline (owner, 2026-11-17), so a change or a Dependabot bump to the
# extension is built on its pull request into dev, not first at promotion.
on:
  push:
    branches: [ "mainline", "dev" ]
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    branches: [ "mainline", "dev" ]
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode-extension.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: editors/vscode

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: editors/vscode/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run lint

    - name: Build (esbuild)
      run: npm run package

    - name: Package VSIX
      run: npx vsce package --no-dependencies

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v7
      with:
        name: sharpy-lang-vsix
        path: editors/vscode/*.vsix
        retention-days: 30
