# This workflow runs Python tests for the build_tools module
# Separate from the .NET tests to keep concerns isolated

name: Python Build Tools

on:
  push:
    branches: [ "mainline" ]
    paths:
      - 'build_tools/**'
      - '.github/workflows/python-build-tools.yml'
      # build_tools/tests/test_ci_gate.py runs ci-summary's inline script from this workflow.
      - '.github/workflows/dotnet10.yml'
      - '!build_tools/**/*.md'
      # build_tools/tests/test_dotnet_serialized_lock.py drives this bash script directly
      # (#1508). Without it here a wrapper-only change rides to mainline with its own
      # regression harness never run — which is how the same lock hazard shipped three times.
      - '.claude/scripts/**'
      # The `hooks` job runs .claude/hooks/test-hooks.sh against the hooks beside it.
      - '.claude/hooks/**'
      - 'src/Sharpy.Core/**'
      - 'src/Sharpy.Stdlib/**'
      - 'src/Sharpy.Stdlib.Tests/Spy/cpython/**'
      - 'docs/stdlib/**'
      - 'docs/deviations.yaml'
      # build_tools/process_index.py --check: the index is regenerated from the charter (W3.3).
      - 'docs/process/rounds/**'
      - 'mkdocs.yml'
  # Every PR, whatever its base; see the note on the same trigger in dotnet10.yml.
  pull_request:
    paths:
      - 'build_tools/**'
      - '.github/workflows/python-build-tools.yml'
      # See the push filter above.
      - '.github/workflows/dotnet10.yml'
      - '!build_tools/**/*.md'
      # See the push filter above (#1508).
      - '.claude/scripts/**'
      # The `hooks` job runs .claude/hooks/test-hooks.sh against the hooks beside it.
      - '.claude/hooks/**'
      - 'src/Sharpy.Core/**'
      - 'src/Sharpy.Stdlib/**'
      - 'src/Sharpy.Stdlib.Tests/Spy/cpython/**'
      - 'docs/stdlib/**'
      - 'docs/deviations.yaml'
      # build_tools/process_index.py --check: the index is regenerated from the charter (W3.3).
      - 'docs/process/rounds/**'
      - 'mkdocs.yml'
  # The second half of the gate that .claude/scripts/ci-gate dispatches.
  workflow_dispatch:

# See the note on the same block in dotnet10.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Runs take ~4 min end to end (e.g. 42372810631); the 6-hour default is what a hang would cost.
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install sharpy_auto_builder as editable package
        pip install -e "build_tools/sharpy_auto_builder[dev]"
        # click is required by the build_tools CLI (used by the stdlib docs check)
        pip install click

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore the NuGet package cache
      # Read-only; dotnet10.yml's `build` job saves it (#2458).
      id: nuget
      uses: actions/cache/restore@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
        restore-keys: nuget-${{ runner.os }}-

    # test_real_compiler_smoke needs a compiler. Building it here keeps a cold build out of the test,
    # where it raced compile_one's 60 s limit (35-57 s when green, timed out on run 42338092202).
    - name: Build sharpyc
      run: dotnet build src/Sharpy.Cli

    - name: Run tests with pytest
      env:
        # Add repo root to PYTHONPATH to support 'from build_tools.' imports
        PYTHONPATH: ${{ github.workspace }}
        SHARPYC: ${{ github.workspace }}/src/Sharpy.Cli/bin/Debug/net10.0/sharpyc
      run: |
        python -m pytest build_tools/tests/ -v --tb=short

    - name: Check stdlib docs are up to date
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m build_tools stdlib generate --check

  # The falsification harness for the Claude Code hooks (W0.1, 7c9567288; run in CI since #2458,
  # W0.4): 61 cases in about 13 s locally, needing bash and python3 only (each hook's `dotnet` is a
  # stub). Its python branch of format-on-save.sh SKIPS without ruff or black on PATH, so ruff is
  # installed and the step fails on any skip: a runner without it would otherwise pass 59 cases.
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version

    - name: Install ruff
      run: python -m pip install "ruff==0.16.9"

    - name: Run the hook harness (fails on any FAIL or SKIP)
      run: |
        set -o pipefail
        bash .claude/hooks/test-hooks.sh | tee hooks.log
        grep -Eq '^hooks: [0-9]+ passed, 0 failed, 0 skipped$' hooks.log \
          || { echo "::error::test-hooks.sh failed or skipped a case (see the PASS/FAIL/SKIP lines above)"; exit 1; }

  # Dual-execution oracle (#1030): the ported CPython tests under
  # src/Sharpy.Stdlib.Tests/Spy/cpython/ must also pass under stock python3,
  # proving they are a faithful oracle. Pure stdlib — no pip install, no dotnet.
  # The Python setup here is shared with Phase 9 (grammar-fuzz differential).
  dual-execute-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version

    - name: Install PyYAML for the divergence ledger
      run: python -m pip install --upgrade pip pyyaml

    - name: Verify the divergence ledger is up to date
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m build_tools.cpython_oracle ledger --check

    - name: Verify the process index matches the charter
      # docs/process/rounds/index.md is generated from the newest charter (handoff W3.3).
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m build_tools.process_index --check

    - name: Dual-execute ported CPython tests under python3 (ledger-enforced)
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m build_tools.cpython_oracle.dual_run \
          --ledger build_tools/cpython_oracle/ledger.yaml \
          src/Sharpy.Stdlib.Tests/Spy/cpython/
