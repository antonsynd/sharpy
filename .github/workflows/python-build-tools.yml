# This workflow runs Python tests for the build_tools module
# Separate from the .NET tests to keep concerns isolated

name: Python Build Tools

on:
  push:
    branches: [ "mainline" ]
    # The `changes` job's RELEVANT_PATHS, entry for entry (build_tools/tests/test_workflow_relevance.py).
    paths:
      - 'build_tools/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.claude/**'
      - 'CLAUDE.md'
      - '.python-version'
      - 'docs/process/**'
      - 'src/**/*allowlist*.txt'
      - 'src/Sharpy.Compiler/**'
      - 'src/Sharpy.Cli/**'
      - 'src/Sharpy.Lsp/**'
      - 'src/Sharpy.Core/**'
      - 'src/Sharpy.Stdlib/**'
      - 'src/Sharpy.Stdlib.Tests/Spy/cpython/**'
      - 'Directory.Build.props'
      - '.editorconfig'
      - 'docs/language_specification/**'
      - 'docs/stdlib/**'
      - 'docs/deviations.yaml'
      - 'mkdocs.yml'
  # Every PR, whatever its base; see the note on the same trigger in dotnet10.yml. No path filter, so
  # the workflow always starts and `gate` always reports: `changes` makes the path decision.
  pull_request:
  # The second half of the gate that .claude/scripts/ci-gate dispatches.
  workflow_dispatch:

# See the note on the same block in dotnet10.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Every path whose change can change this workflow's result. The push trigger's `paths` is the
      # same list; build_tools/tests/test_workflow_relevance.py keeps the two equal and fails when a
      # file a step reads by path (a script, `python-version-file`) is missing.
      RELEVANT_PATHS: |
        build_tools/**
        # build_tools/tests/ parses the workflows: test_ci_gate.py runs ci-summary's inline
        # script, test_workflow_relevance.py reads every workflow and the local actions.
        .github/workflows/**
        .github/actions/**
        # test_dotnet_serialized_lock.py drives .claude/scripts/ (#1508), the `hooks` job runs
        # .claude/hooks/test-hooks.sh, and build_tools/tests/ checks read the skills and settings.
        .claude/**
        CLAUDE.md
        # The interpreter every job here sets up (python-version-file).
        .python-version
        # process_index.py --check regenerates docs/process/rounds/index.md from the charter
        # (W3.3); build_tools/tests/ checks read the plans.
        docs/process/**
        # Gap-discovery allowlists, read by build_tools/tests/ checks.
        src/**/*allowlist*.txt
        # The test job builds src/Sharpy.Cli (and what it references) for the compiler smoke
        # tests, and build_tools/tests/ checks read compiler sources (SemanticInfo.cs, Lexer/).
        src/Sharpy.Compiler/**
        src/Sharpy.Cli/**
        src/Sharpy.Lsp/**
        src/Sharpy.Core/**
        src/Sharpy.Stdlib/**
        src/Sharpy.Stdlib.Tests/Spy/cpython/**
        Directory.Build.props
        .editorconfig
        docs/language_specification/**
        docs/stdlib/**
        docs/deviations.yaml
        mkdocs.yml
    outputs:
      relevant: ${{ steps.relevant.outputs.relevant }}

    steps:
    - uses: actions/checkout@v7
      with:
        # See the same step in dotnet10.yml.
        fetch-depth: 2
    - name: Is anything in RELEVANT_PATHS changed?
      id: relevant
      uses: ./.github/actions/relevant-changes
      with:
        paths: ${{ env.RELEVANT_PATHS }}

  test:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    # Runs take ~4 min end to end (e.g. 42372810631); the 6-hour default is what a hang would cost.
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        # Full history, and every branch as origin/<name> (so origin/<base> on a PR; run
        # 42946009826 fetched +refs/heads/*:refs/remotes/origin/*): a build_tools/tests/ check
        # diffs against the merge base with the PR's base branch.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install sharpy_auto_builder as editable package
        pip install -e "build_tools/sharpy_auto_builder[dev]"
        # click is required by the build_tools CLI (used by the stdlib docs check)
        pip install click

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore the NuGet package cache
      # Read-only; dotnet10.yml's `build` job saves it (#2458).
      id: nuget
      uses: actions/cache/restore@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
        restore-keys: nuget-${{ runner.os }}-

    # test_real_compiler_smoke needs a compiler. Building it here keeps a cold build out of the test,
    # where it raced compile_one's 60 s limit (35-57 s when green, timed out on run 42338092202).
    - name: Build sharpyc
      run: dotnet build src/Sharpy.Cli

    - name: Run tests with pytest
      env:
        # Add repo root to PYTHONPATH to support 'from build_tools.' imports
        PYTHONPATH: ${{ github.workspace }}
        SHARPYC: ${{ github.workspace }}/src/Sharpy.Cli/bin/Debug/net10.0/sharpyc
      run: |
        python -m pytest build_tools/tests/ -v --tb=short

    - name: Check stdlib docs are up to date
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m build_tools stdlib generate --check

  # The falsification harness for the Claude Code hooks (W0.1, 7c9567288; run in CI since #2458,
  # W0.4): 61 cases in about 13 s locally, needing bash and python3 only (each hook's `dotnet` is a
  # stub). Its python branch of format-on-save.sh SKIPS without ruff or black on PATH, so ruff is
  # installed and the step fails on any skip: a runner without it would otherwise pass 59 cases.
  hooks:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version

    - name: Install ruff
      run: python -m pip install "ruff==0.16.9"

    - name: Run the hook harness (fails on any FAIL or SKIP)
      run: |
        set -o pipefail
        bash .claude/hooks/test-hooks.sh | tee hooks.log
        grep -Eq '^hooks: [0-9]+ passed, 0 failed, 0 skipped$' hooks.log \
          || { echo "::error::test-hooks.sh failed or skipped a case (see the PASS/FAIL/SKIP lines above)"; exit 1; }

  # Dual-execution oracle (#1030): the ported CPython tests under
  # src/Sharpy.Stdlib.Tests/Spy/cpython/ must also pass under stock python3,
  # proving they are a faithful oracle. Pure stdlib — no pip install, no dotnet.
  # The Python setup here is shared with Phase 9 (grammar-fuzz differential).
  dual-execute-oracle:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version

    - name: Install PyYAML for the divergence ledger
      run: python -m pip install --upgrade pip pyyaml

    - name: Verify the divergence ledger is up to date
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m build_tools.cpython_oracle ledger --check

    - name: Verify the process index matches the charter
      # docs/process/rounds/index.md is generated from the newest charter (handoff W3.3).
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m build_tools.process_index --check

    - name: Dual-execute ported CPython tests under python3 (ledger-enforced)
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m build_tools.cpython_oracle.dual_run \
          --ledger build_tools/cpython_oracle/ledger.yaml \
          src/Sharpy.Stdlib.Tests/Spy/cpython/

  # The one check to require in the `dev` ruleset; see the `gate` job of dotnet10.yml, which this
  # mirrors. Each needed job's result is read from `needs` one by one: `failure` or `cancelled` is
  # red, `success` and `skipped` pass, and on a change `changes` did not prove irrelevant every job
  # in MUST_SUCCEED must have succeeded.
  gate:
    name: Gate (Python build tools)
    if: ${{ always() }}
    needs: [changes, test, hooks, dual-execute-oracle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
      RELEVANT: ${{ needs.changes.outputs.relevant }}
      MUST_SUCCEED: test hooks dual-execute-oracle
    steps:
    - name: Fail on any failed or cancelled job
      run: |
        set -euo pipefail
        echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        echo "relevant: ${RELEVANT:-<unset>}"
        if [ "$(echo "$NEEDS" | jq 'length')" -eq 0 ]; then echo "::error::no needed job was read"; exit 1; fi
        bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"] | join(" ")')
        if [ -n "$bad" ]; then echo "::error::needed job(s) failed or were cancelled: $bad"; exit 1; fi
        if [ "$RELEVANT" != "false" ]; then
          for job in $MUST_SUCCEED; do
            result=$(echo "$NEEDS" | jq -r --arg j "$job" '.[$j].result // "missing"')
            if [ "$result" != "success" ]; then echo "::error::relevant change, but $job is $result"; exit 1; fi
          done
        fi
        echo "gate passed"
