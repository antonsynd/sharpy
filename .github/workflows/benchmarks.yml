# Benchmark workflow for Sharpy compiler
# Runs BenchmarkDotNet suite and uploads results as artifacts

name: Benchmarks

on:
  # Pushes as well as PRs (#2458, W0.4): mainline takes about ten direct pushes per PR, so a
  # PR-only allocation gate ran 13 times against 124 pushes (audit 2026-11-06 §6).
  push:
    branches: [ "mainline" ]
    paths:
      - 'src/Sharpy.Compiler/**'
      - 'src/Sharpy.Compiler.Benchmarks/**'
  pull_request:
    branches: [ "mainline" ]
    paths:
      - 'src/Sharpy.Compiler/**'
      - 'src/Sharpy.Compiler.Benchmarks/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # 3.3-5.8 min over the last 10 runs (42313933106 back to 39210525208).
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore the NuGet package cache
      # Read-only; dotnet10.yml's `build` job saves it (#2458).
      id: nuget
      uses: actions/cache/restore@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore src/Sharpy.Compiler.Benchmarks/Sharpy.Compiler.Benchmarks.csproj

    - name: Run Benchmarks
      run: |
        dotnet run --project src/Sharpy.Compiler.Benchmarks -c Release --no-restore \
          -- --filter "*CompilerBenchmarks*" --exporters json markdown \
          --artifacts ./BenchmarkResults

    - name: Upload Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ github.run_number }}
        path: BenchmarkResults/
        retention-days: 30

    # Allocation-regression gate: fail the build if any benchmark's Allocated column
    # (BenchmarkDotNet [MemoryDiagnoser]) regressed > 10% vs benchmarks/allocation-baseline.json.
    # Refresh the baseline deliberately (reviewed like a snapshot) — see the file's _comment.
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version

    - name: Allocation-regression gate
      run: |
        python -m build_tools.allocation_gate check \
          --baseline benchmarks/allocation-baseline.json \
          --results ./BenchmarkResults
      env:
        PYTHONPATH: ${{ github.workspace }}
