# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET 10

on:
  push:
    branches: [ "mainline" ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'samples/**'
      - 'build_tools/**'
      - 'dogfood_output/**'
      - 'editors/**'
      - 'benchmarks/**'
      - 'site/**'
      - '.claude/**'
      - '.vscode/**'
      - '.github/agents/**'
      - '.github/instructions/**'
      - '*.md'
      - 'LICENSE'
      - 'mkdocs.yml'
      - 'chiri_config.json5'
  pull_request:
    branches: [ "mainline" ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'samples/**'
      - 'build_tools/**'
      - 'dogfood_output/**'
      - 'editors/**'
      - 'benchmarks/**'
      - 'site/**'
      - '.claude/**'
      - '.vscode/**'
      - '.github/agents/**'
      - '.github/instructions/**'
      - '*.md'
      - 'LICENSE'
      - 'mkdocs.yml'
      - 'chiri_config.json5'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup Python
      # Required by BOTH CPython oracles: the differential-parse property tests
      # (Sharpy.Compiler.Tests -> CPythonDifferentialParseTests, #1037), which oracle
      # generated programs against `python3` ast.parse, AND the differential-execution
      # sweep (DifferentialExecutionTests, #1156), which compares compiled-program stdout
      # against `python3` running the same source. Pinned to 3.12 so behavior is stable.
      # Both soft-skip if no suitable python is found — so removing this step would not
      # fail CI, it would silently disarm the execution oracle's ratchet. Keep the pin.
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install oracle third-party modules
      # ORACLE_THIRD_PARTY (build_tools/differential_exec/run_programs.py) declares the
      # non-stdlib modules the execution oracle compares against CPython (currently PyYAML).
      # This install is load-bearing, not an optimization: the oracle's vacuity guard in
      # DifferentialExecutionTests FAILS (it does not skip) when a whitelisted module's
      # cells can never be compared because the children cannot import it — which is what
      # a runner without PyYAML produces. Keep this list in step with ORACLE_THIRD_PARTY.
      run: python -m pip install "pyyaml>=6,<7"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Verify all test projects are covered
      run: |
        # Fail CI if a test project exists in src/ but isn't listed below
        known="Sharpy.Cli.Tests Sharpy.Compiler.Tests Sharpy.Core.Tests Sharpy.Lsp.Tests Sharpy.Stdlib.Tests"
        found=$(find src -maxdepth 1 -name "*.Tests" -type d -printf '%f\n' | sort | tr '\n' ' ' | sed 's/ $//')
        if [ "$found" != "$known" ]; then
          echo "::error::Test project drift detected. Expected: [$known] Found: [$found]"
          echo "Update the test steps in .github/workflows/dotnet10.yml"
          exit 1
        fi
    - name: Test CLI
      run: dotnet test src/Sharpy.Cli.Tests --no-build --verbosity normal --filter "Category!=Benchmark"
    - name: Test Core
      run: dotnet test src/Sharpy.Core.Tests --no-build --verbosity normal --filter "Category!=Benchmark"
    - name: Test Compiler
      # The interop conformance sweep (#1034) is heavy (~1–2 min, thousands of in-process
      # compiles); it runs in its own dedicated step below so the main test pass stays fast.
      # The generic-reference matrix (#1143, ~158 in-process compiles) still runs INLINE here:
      # it is light enough that a dedicated step isn't warranted. The front-end parity sweep
      # (#1144) runs inline in the LSP step for the same reason. Split any of them out only if
      # they grow heavy.
      # The metamorphic corpus sweep (#1157) IS heavy (~1.5 min, ~14,600 in-process compiles)
      # and has its own step below; excluding it here also keeps its RandomProperty sibling
      # (MetamorphicCorpusInvarianceTests, which spawns a dotnet subprocess per pair) out of CI.
      # The CPython execution oracle likewise earned its own step when #1202 took it from a
      # 60-program sample to the full ~565-cell pool.
      run: dotnet test src/Sharpy.Compiler.Tests --no-build --verbosity normal --filter "Category!=Benchmark&FullyQualifiedName!~InteropConformance&FullyQualifiedName!~MetamorphicCorpus&FullyQualifiedName!~DifferentialExecution"
    - name: Test Stdlib
      run: dotnet test src/Sharpy.Stdlib.Tests --no-build --verbosity normal --filter "Category!=Benchmark"
    - name: Test LSP
      run: dotnet test src/Sharpy.Lsp.Tests --no-build --verbosity normal --filter "Category!=Benchmark"
    - name: Interop conformance sweep (#1034)
      # Generated interop conformance sweep over every public stdlib member. Emits
      # .claude/tmp/interop-conformance-report.json; becomes a ratchet once the reviewed
      # allowlist (src/Sharpy.Compiler.Tests/Conformance/interop-allowlist.txt) is present.
      run: dotnet test src/Sharpy.Compiler.Tests --no-build --verbosity normal --filter "Category=GapDiscovery&FullyQualifiedName~InteropConformance"
    - name: Metamorphic corpus sweep (#1157)
      # Every executing fixture x every semantics-preserving transform must still compile with
      # no new diagnostic code (~14,600 cells, ~1.5 min). Emits
      # .claude/tmp/metamorphic-corpus-report.json and ratchets against the reviewed allowlist
      # (src/Sharpy.Compiler.Tests/Conformance/metamorphic-allowlist.txt), which also fails on
      # STALE entries so a landed fix must drain its lines.
      # Category=GapDiscovery deliberately selects the compile-clean sweep ONLY: the
      # output-invariance sample is Category=RandomProperty, executes real programs in
      # subprocesses, and draws a fresh sample per run — it belongs in /property-stress, not in a
      # deterministic CI gate.
      run: dotnet test src/Sharpy.Compiler.Tests --no-build --verbosity normal --filter "Category=GapDiscovery&FullyQualifiedName~MetamorphicCorpus"
    - name: CPython differential execution oracle (#1202)
      # Sharpy-compiled stdout vs batched `python3` over the shared executable subset. Since
      # #1202 the fixture arm sweeps its ENTIRE eligible pool every run (565 cells, ~46 s on a
      # dev machine) rather than a 60-program sample that reached 4% of it, which is what moved
      # it out of the main Compiler step. Emits .claude/tmp/differential-exec-report.json —
      # including the run's own coverage % — and ratchets against the reviewed allowlist
      # (src/Sharpy.Compiler.Tests/Conformance/differential-exec-allowlist.txt), where every
      # entry cites a docs/deviations.yaml id or an issue number.
      # Needs the python step above; the test soft-skips (green) without a suitable python3, so
      # a missing report means the oracle did not run, not that it agreed.
      run: dotnet test src/Sharpy.Compiler.Tests --no-build --verbosity normal --filter "Category=GapDiscovery&FullyQualifiedName~DifferentialExecution"
    - name: Verify .spy stdlib native compilation
      run: dotnet run --project src/Sharpy.Cli -- project src/Sharpy.Stdlib/spy/stdlib.spyproj
    - name: Verify .spy stdlib C# staleness
      run: bash build_tools/check_spy_staleness.sh
    - name: Verify .spy test C# staleness
      run: bash build_tools/check_spy_tests_staleness.sh
    - name: Log per-module stdlib assembly sizes
      run: |
        echo "=== Per-module stdlib assembly sizes (net10.0) ==="
        find src/Sharpy.Stdlib/modules/bin -name "Sharpy.Stdlib.*.dll" -path "*/net10.0/*" \
          | sort \
          | while read f; do
              size=$(stat --format="%s" "$f" 2>/dev/null || stat -f "%z" "$f" 2>/dev/null)
              printf "  %-40s %s bytes\n" "$(basename "$f")" "$size"
            done
        echo "=== Monolith size ==="
        monolith="src/Sharpy.Stdlib/bin/Debug/net10.0/Sharpy.Stdlib.dll"
        if [ -f "$monolith" ]; then
          size=$(stat --format="%s" "$monolith" 2>/dev/null || stat -f "%z" "$monolith" 2>/dev/null)
          printf "  %-40s %s bytes\n" "$(basename "$monolith")" "$size"
        fi
