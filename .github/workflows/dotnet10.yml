# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
#
# Shape (#2178): build ONCE, then fan out. The `build` job restores, builds, runs the
# test-project-drift gate, and hands its src/**/bin + src/**/obj to the test jobs as one tarball
# artifact; every test job runs `dotnet test --no-build` against it.
#
#   changes ─┬─ format                       whitespace-clean gate (needs no build, so beside it)
#            └─ build ─┬─ test-fast          CLI + Core + Stdlib (one step each)
#                      ├─ lsp (matrix 1..N)  LSP tests, sharded by namespace and sweep twin
#                      ├─ compiler (1..7)    the pre-#2178 "Test Compiler" step, sharded by namespace
#                      ├─ sweep (matrix 2)   one job per long GapDiscovery sweep
#                      ├─ sweeps-quick       the four short GapDiscovery sweeps, one step each
#                      ├─ stdlib-spy-gates   .spy native compile + generated-C# staleness gates
#                      └─ shard-partition    proves each suite's shards partition its main filter
#
# Job count: the account runs at most 20 jobs at once, and `windows` plus CodeQL's csharp analysis
# are still running when `build` finishes, so the fan-out under `build` is kept at 18. At 22
# (run 38983789798) four jobs queued 31-86 s, and the last-started LSP shard set the wall clock.
#   windows (no needs)                       debug-info guard + README hello world on win-x64
#   ci-summary (needs all, always runs)      the single check to require: fails unless every job
#                                            succeeded and every expected trx reports tests.
#
# A README.md-only change (README is a trigger path because the windows job runs its hello world)
# skips `format`, `build` and everything under it: `changes` decides, `windows` still runs, and
# ci-summary then expects only the windows trx.

name: .NET 10

on:
  push:
    branches: [ "mainline" ]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'sharpy.sln'
      - '.github/workflows/dotnet10.yml'
      - 'build_tools/smoke_hello.sh'
      - 'README.md'
  pull_request:
    branches: [ "mainline" ]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'sharpy.sln'
      - '.github/workflows/dotnet10.yml'
      - 'build_tools/smoke_hello.sh'
      - 'README.md'

permissions:
  contents: read

env:
  # The pre-#2178 "Test Compiler" step filter, verbatim. Every Compiler shard runs
  # COMPILER_MAIN_FILTER&COMPILER_SHARD_<n>, so each GapDiscovery sweep excluded here by name
  # still runs exactly once (in its own `sweep` job) and never inline in a shard.
  # Why these sweeps are excluded from the main pass (moved from the old step's comments):
  # the interop conformance sweep (#1034) is heavy (~1–2 min, thousands of in-process compiles).
  # The generic-reference matrix (#1143, ~158 in-process compiles) still runs INLINE in the main
  # pass: it is light enough that a dedicated job isn't warranted. The front-end parity sweep
  # (#1144) runs inline in the LSP step for the same reason. Split any of them out only if they
  # grow heavy. The metamorphic corpus sweep (#1157) IS heavy (~1.5 min, ~14,600 in-process
  # compiles); excluding it here also keeps its RandomProperty sibling
  # (MetamorphicCorpusInvarianceTests, which spawns a dotnet subprocess per pair) out of CI.
  # The CPython execution oracle likewise earned its own job when #1202 took it from a
  # 60-program sample to the full ~565-cell pool.
  # The in-process isolation sweep (#2250) is excluded by Category AND name, not by name alone:
  # InProcessIsolationSweepTests also carries a regular-suite slice (threads {1, 2} x 1
  # repetition) and its controls, which must keep running in the shards — a bare
  # `FullyQualifiedName!~InProcessIsolation` would leave them selected by no step
  # (CiFilterCoverageConformanceTests).
  COMPILER_MAIN_FILTER: "Category!=Benchmark&FullyQualifiedName!~InteropConformance&FullyQualifiedName!~MetamorphicCorpus&FullyQualifiedName!~DifferentialExecution&FullyQualifiedName!~FormatSpecDifferential&FullyQualifiedName!~FormatterEmitInvariance&(Category!=GapDiscovery|FullyQualifiedName!~InProcessIsolation)"
  # Compiler shard buckets (#2178). Shard n runs COMPILER_MAIN_FILTER&COMPILER_SHARD_<n>.
  # PARTITION INVARIANT: shards 1–6 are positive namespace buckets (shard 5 excludes shard 4's
  # sub-bucket by negation); shard 7 is "everything else" — the negation of every other bucket
  # (`!~Properties.` negates shards 4+5, whose buckets are both inside `Properties.`). The
  # `compiler-shard-partition` job re-proves on every run, by `--list-tests`, that the shards'
  # union equals the main filter's list with no overlap, and `ci-summary` requires one trx per
  # COMPILER_SHARD_<n>. Adding a shard: add COMPILER_SHARD_<n>, add <n> to the `compiler` matrix,
  # and add its bucket's negation to the last shard.
  # Balanced on per-shard trx spans of PR run 37378225480 @ 86825825e (#2179, maxParallelThreads 2),
  # in s: 1 fixtures 124 · 2 Integration P–V + CodeGen 305 · Semantic 108 + 133 (then shards 3, 4)
  # · Properties 492 (then shard 5: 287 s parallel phase led by CPythonDifferentialParse 178 and
  # AmbiguityHotspot 169, then a 204 s run-alone PropertySerial phase) · 6 Conformance 150 ·
  # 7 everything else 259. Re-balanced (#2179): the two Semantic shards merged into 3, and
  # Properties split into 4 (Properties.Parser) and 5 (the rest).
  # Letter terms name only class initials that exist today: CiFilterCoverageConformanceTests
  # fails on a filter substring that matches no test. A new class whose initial has no term
  # falls through to shard 7 (Integration), so it is still run exactly once.
  # 1: the file-based fixture corpus (the Shard0..Shard7 classes of the FileBasedIntegrationTests
  # namespace, #2179; the trailing dot selects them all).
  COMPILER_SHARD_1: "FullyQualifiedName~Sharpy.Compiler.Tests.Integration.FileBasedIntegrationTests."
  # 2: Integration classes whose name starts P, S, T, U or V, plus CodeGen.
  COMPILER_SHARD_2: "(FullyQualifiedName~Sharpy.Compiler.Tests.Integration.P|\
    FullyQualifiedName~Sharpy.Compiler.Tests.Integration.S|\
    FullyQualifiedName~Sharpy.Compiler.Tests.Integration.T|\
    FullyQualifiedName~Sharpy.Compiler.Tests.Integration.U|\
    FullyQualifiedName~Sharpy.Compiler.Tests.Integration.V|\
    FullyQualifiedName~Sharpy.Compiler.Tests.CodeGen.)"
  # 3: Semantic (all of it, sub-namespaces included, e.g. Semantic.Validation).
  COMPILER_SHARD_3: "FullyQualifiedName~Sharpy.Compiler.Tests.Semantic."
  # 4: Properties.Parser (includes CPythonDifferentialParseTests, which needs the pinned python,
  # and AmbiguityHotspotPropertyTests — the two longest classes of the old Properties shard).
  COMPILER_SHARD_4: "FullyQualifiedName~Sharpy.Compiler.Tests.Properties.Parser."
  # 5: the rest of Properties (exactly `Properties.` minus shard 4), including the run-alone
  # PropertySerial phase.
  COMPILER_SHARD_5: "FullyQualifiedName~Sharpy.Compiler.Tests.Properties.&\
    FullyQualifiedName!~Sharpy.Compiler.Tests.Properties.Parser."
  # 6: Conformance (non-sweep conformance suites; the sweeps are excluded by the main filter).
  COMPILER_SHARD_6: "FullyQualifiedName~Sharpy.Compiler.Tests.Conformance."
  # 7: everything else — Integration classes outside shards 1–2, Parser, Lexer, Project,
  # Infrastructure, root-namespace tests, and any namespace added later. The negation of every
  # bucket above.
  COMPILER_SHARD_7: "FullyQualifiedName!~Sharpy.Compiler.Tests.Integration.FileBasedIntegrationTests.&\
    FullyQualifiedName!~Sharpy.Compiler.Tests.Integration.P&\
    FullyQualifiedName!~Sharpy.Compiler.Tests.Integration.S&\
    FullyQualifiedName!~Sharpy.Compiler.Tests.Integration.T&\
    FullyQualifiedName!~Sharpy.Compiler.Tests.Integration.U&\
    FullyQualifiedName!~Sharpy.Compiler.Tests.Integration.V&\
    FullyQualifiedName!~Sharpy.Compiler.Tests.CodeGen.&\
    FullyQualifiedName!~Sharpy.Compiler.Tests.Semantic.&\
    FullyQualifiedName!~Sharpy.Compiler.Tests.Properties.&\
    FullyQualifiedName!~Sharpy.Compiler.Tests.Conformance."

  # The LSP step's filter before it was sharded. Shard n runs LSP_MAIN_FILTER&LSP_SHARD_<n>; the
  # same PARTITION INVARIANT as the Compiler shards holds (the `shard-partition` job re-proves it by
  # `--list-tests`, and ci-summary requires one trx per LSP_SHARD_<n>), and the last shard is the
  # negation of every other bucket, so a new namespace falls through to it.
  # Balanced on CI per-shard test steps (run 38983789798): 271 / 346 / 173 / 283 / 205 s as first
  # split, against 20.7 min for the one unsharded step (run 38963710211); with the CRLF twin moved to
  # shard 3, run 38994447393 measured shard 2 (wide alone) at 101 s and shard 3 at 326 s (CR 121 s,
  # controls + census 41 s), so the lone-CR twin then moved to shard 2. FormattingRouteParitySweepTests was 16,510 of the 21,938 rows and, as one
  # class, an 849 s serial span; its five twin theories are split across shards 1-3, each with its
  # own twin census (`<Twin>_Census_*`, selected by the same prefix; SHARPY_ROUTE_SWEEP_PINS_REQUIRED
  # in the `lsp` job makes a census whose twin did not run in its process fail instead of skip).
  # The E2E route matrix (ProjectDiagnosticRoutesTests, a 407 s serial class) runs as one class per
  # state in shard 5.
  LSP_MAIN_FILTER: "Category!=Benchmark"
  # 1: the comment twin (263 s on CI).
  LSP_SHARD_1: "FullyQualifiedName~Sharpy.Lsp.Tests.Conformance.FormattingRouteParitySweepTests.CommentInjected_"
  # 2: the wide and lone-CR twins (101 + 121 s on CI; `.Cr_` does not match `.Crlf_`).
  LSP_SHARD_2: "(FullyQualifiedName~Sharpy.Lsp.Tests.Conformance.FormattingRouteParitySweepTests.WideIndented_|\
    FullyQualifiedName~Sharpy.Lsp.Tests.Conformance.FormattingRouteParitySweepTests.Cr_)"
  # 3: the rest of FormattingRouteParitySweepTests — the identity and CRLF twins (~163 s on CI), the
  # controls and the corpus census (~41 s: it enumerates the twins this process did not run).
  LSP_SHARD_3: "FullyQualifiedName~Sharpy.Lsp.Tests.Conformance.FormattingRouteParitySweepTests.&\
    FullyQualifiedName!~Sharpy.Lsp.Tests.Conformance.FormattingRouteParitySweepTests.CommentInjected_&\
    FullyQualifiedName!~Sharpy.Lsp.Tests.Conformance.FormattingRouteParitySweepTests.WideIndented_&\
    FullyQualifiedName!~Sharpy.Lsp.Tests.Conformance.FormattingRouteParitySweepTests.Cr_"
  # 4: the rest of Conformance (CodeActionShapeSweepTests, FrontEndParityTests, WarmInstanceParityTests, ...).
  LSP_SHARD_4: "FullyQualifiedName~Sharpy.Lsp.Tests.Conformance.&\
    FullyQualifiedName!~Sharpy.Lsp.Tests.Conformance.FormattingRouteParitySweepTests."
  # 5: everything else — the root namespace, E2E, Refactoring, Analysis, Properties, and any namespace
  # added later.
  LSP_SHARD_5: "FullyQualifiedName!~Sharpy.Lsp.Tests.Conformance."

jobs:
  changes:
    name: Detect a README-only change
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
    - uses: actions/checkout@v7
      with:
        # A pull_request checkout is the merge commit: its first parent is the base, so HEAD^1..HEAD
        # is exactly the PR's diff. A push compares against the event's `before` (fetched below).
        fetch-depth: 2
    - name: Is anything besides README.md changed?
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      # Fails safe: an unknown range (a new branch's all-zero `before`, a force-push whose `before`
      # is gone) or an empty file list counts as a code change, so the full suite runs. Only a
      # range that provably touches README.md alone skips it.
      run: |
        set -uo pipefail
        base=""
        if [ "$EVENT" = "pull_request" ]; then
          base=$(git rev-parse -q --verify HEAD^1 || true)
        elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
          git fetch --no-tags --depth=1 origin "$BEFORE" && base="$BEFORE"
        fi
        files=""
        [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD || true)
        printf 'changed files (%s..HEAD):\n%s\n' "${base:-?}" "${files:-<unknown>}"
        if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvx 'README.md'; then
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "README.md-only change: the build and test jobs are skipped; windows runs its hello world"
        else
          echo "code=true" >> "$GITHUB_OUTPUT"
        fi

  format:
    name: Generated C# is whitespace-clean
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Verify generated C# is whitespace-clean (#1641)
      # Regenerated spy-test/spy-stdlib C# is compiled from the compiler under test; a stray
      # trivia token in the emitter (`(int? )`) lands in generated/ and fails `dotnet format`.
      # The whole solution is checked so the gate cannot be dodged by adding a generated tree.
      # The generated C# is committed and the build writes no tracked file, so this needs no build
      # output and runs beside `build` instead of inside it (~50 s off the critical path).
      run: dotnet format whitespace sharpy.sln --verify-no-changes

  build:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Verify all test projects are covered
      run: |
        # Fail CI if a test project exists in src/ but isn't listed below
        known="Sharpy.Cli.Tests Sharpy.Compiler.Tests Sharpy.Core.Tests Sharpy.Lsp.Tests Sharpy.Stdlib.Tests"
        found=$(find src -maxdepth 1 -name "*.Tests" -type d -printf '%f\n' | sort | tr '\n' ' ' | sed 's/ $//')
        if [ "$found" != "$known" ]; then
          echo "::error::Test project drift detected. Expected: [$known] Found: [$found]"
          echo "Update the test steps in .github/workflows/dotnet10.yml"
          exit 1
        fi
    - name: Package build output for the test jobs
      # One tarball rather than a path glob: upload-artifact drops POSIX permission bits (the
      # sharpyc apphost must stay executable) and mtimes; tar keeps both. obj/ rides along because
      # `dotnet test --no-build` still evaluates each project (project.assets.json, nuget.g.props);
      # the absolute paths baked into obj/ match because every job checks out to the same
      # $GITHUB_WORKSPACE on the same runner image.
      run: |
        set -o pipefail
        find src -type d \( -name bin -o -name obj \) -prune -print0 \
          | tar --null -cf - -T - \
          | zstd -T0 -3 -q -c > build-output.tar.zst
        ls -l build-output.tar.zst
    - name: Upload build output
      uses: actions/upload-artifact@v7
      with:
        name: build-output
        path: build-output.tar.zst
        retention-days: 1
        compression-level: 0
        if-no-files-found: error

  test-fast:
    name: Test CLI, Core, Stdlib
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      # Populates the NuGet package folder that the restored obj/*.nuget.g.props import from.
      run: dotnet restore
    - name: Download build output
      uses: actions/download-artifact@v8
      with:
        name: build-output
    - name: Unpack build output
      id: unpack
      run: |
        set -o pipefail
        zstd -dc build-output.tar.zst | tar -xf -
        rm build-output.tar.zst
    # Each assembly reports even if an earlier one failed.
    - name: Test CLI
      if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
      run: dotnet test src/Sharpy.Cli.Tests --no-build --verbosity normal --filter "Category!=Benchmark" --logger "trx;LogFileName=cli.trx" --results-directory TestResults
    - name: Test Core
      if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
      run: dotnet test src/Sharpy.Core.Tests --no-build --verbosity normal --filter "Category!=Benchmark" --logger "trx;LogFileName=core.trx" --results-directory TestResults
    - name: Test Stdlib
      if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
      run: dotnet test src/Sharpy.Stdlib.Tests --no-build --verbosity normal --filter "Category!=Benchmark" --logger "trx;LogFileName=stdlib.trx" --results-directory TestResults
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: trx-fast
        path: TestResults/*.trx
        retention-days: 14
        if-no-files-found: warn

  lsp:
    name: Test LSP (shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    env:
      # Each FormattingRouteParitySweepTests twin census fails instead of skipping when its twin's
      # theory did not run over every stem in the same process: a shard filter that separated a
      # census from its theory would otherwise disarm that twin's pins silently.
      SHARPY_ROUTE_SWEEP_PINS_REQUIRED: "1"
    strategy:
      fail-fast: false
      matrix:
        # One entry per LSP_SHARD_<n> in the workflow env above.
        shard: [1, 2, 3, 4, 5]

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      # Populates the NuGet package folder that the restored obj/*.nuget.g.props import from.
      run: dotnet restore
    - name: Download build output
      uses: actions/download-artifact@v8
      with:
        name: build-output
    - name: Unpack build output
      run: |
        set -o pipefail
        zstd -dc build-output.tar.zst | tar -xf -
        rm build-output.tar.zst
    - name: Test LSP (shard ${{ matrix.shard }})
      run: |
        if [ -z "${LSP_SHARD_${{ matrix.shard }}:-}" ]; then echo "::error::LSP_SHARD_${{ matrix.shard }} is not defined in the workflow env"; exit 1; fi
        echo "filter: $LSP_MAIN_FILTER&$LSP_SHARD_${{ matrix.shard }}"
        dotnet test src/Sharpy.Lsp.Tests --no-build --verbosity normal --filter "$LSP_MAIN_FILTER&$LSP_SHARD_${{ matrix.shard }}" --logger "trx;LogFileName=lsp-shard-${{ matrix.shard }}.trx" --results-directory TestResults
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: trx-lsp-shard-${{ matrix.shard }}
        path: TestResults/*.trx
        retention-days: 14
        if-no-files-found: warn

  compiler:
    name: Test Compiler (shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per COMPILER_SHARD_<n> in the workflow env above.
        shard: [1, 2, 3, 4, 5, 6, 7]

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup Python
      # Required by the differential-parse property tests (Sharpy.Compiler.Tests ->
      # CPythonDifferentialParseTests, #1037), which oracle generated programs against `python3`
      # ast.parse. Set up in EVERY shard so a test moving between namespace buckets can never
      # land on a runner without the pinned interpreter. Pinned to 3.12 so behavior is stable.
      # The tests soft-skip if no suitable python is found — so removing this step would not
      # fail CI, it would silently disarm the oracle. Keep the pin.
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install oracle third-party modules
      # Same interpreter environment the main Compiler pass had before #2178. Keep this list in
      # step with ORACLE_THIRD_PARTY (build_tools/differential_exec/run_programs.py).
      run: python -m pip install "pyyaml>=6,<7"
    - name: Restore dependencies
      # Populates the NuGet package folder that the restored obj/*.nuget.g.props import from.
      run: dotnet restore
    - name: Download build output
      uses: actions/download-artifact@v8
      with:
        name: build-output
    - name: Unpack build output
      run: |
        set -o pipefail
        zstd -dc build-output.tar.zst | tar -xf -
        rm build-output.tar.zst
    - name: Test Compiler (shard ${{ matrix.shard }})
      # The filter is spelled inline as "$COMPILER_MAIN_FILTER&$COMPILER_SHARD_<n>" (not via a
      # shell variable) so CiFilterCoverageConformanceTests can resolve it from this file.
      run: |
        if [ -z "${COMPILER_SHARD_${{ matrix.shard }}:-}" ]; then echo "::error::COMPILER_SHARD_${{ matrix.shard }} is not defined in the workflow env"; exit 1; fi
        echo "filter: $COMPILER_MAIN_FILTER&$COMPILER_SHARD_${{ matrix.shard }}"
        dotnet test src/Sharpy.Compiler.Tests --no-build --verbosity normal --filter "$COMPILER_MAIN_FILTER&$COMPILER_SHARD_${{ matrix.shard }}" --logger "trx;LogFileName=compiler-shard-${{ matrix.shard }}.trx" --results-directory TestResults
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: trx-compiler-shard-${{ matrix.shard }}
        path: TestResults/*.trx
        retention-days: 14
        if-no-files-found: warn

  sweep:
    # The two long GapDiscovery sweeps (~5 min each), one job apiece; the four short ones share
    # `sweeps-quick`. Every sweep is excluded from the Compiler shards by name (COMPILER_MAIN_FILTER).
    name: Sweep (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Metamorphic corpus sweep (#1157). Every executing fixture x every
          # semantics-preserving transform must still compile with no new diagnostic code
          # (~14,600 cells, ~1.5 min). Emits .claude/tmp/metamorphic-corpus-report.json and
          # ratchets against the reviewed allowlist
          # (src/Sharpy.Compiler.Tests/Conformance/metamorphic-allowlist.txt), which also fails
          # on STALE entries so a landed fix must drain its lines.
          # Category=GapDiscovery deliberately selects the compile-clean sweep ONLY: the
          # output-invariance sample is Category=RandomProperty, executes real programs in
          # subprocesses, and draws a fresh sample per run — it belongs in /property-stress, not
          # in a deterministic CI gate.
          - name: metamorphic-corpus
            filter: "Category=GapDiscovery&FullyQualifiedName~MetamorphicCorpus"
          # In-process isolation sweep (P54, #2250). A compile is a function of its inputs alone:
          # seeded per-thread schedules over a corpus (the #2250 cell programs + a stride-16
          # fixture sample) x instance sharing {compiler-per-thread, api-per-thread, api-shared}
          # x 8 threads x 8 repetitions x {analyze, compile-to-IL}, each answer compared with the
          # same (program, operation) run alone on a fresh instance. Emits
          # .claude/tmp/in-process-isolation-report.json and ratchets
          # src/Sharpy.Compiler.Tests/Conformance/in-process-isolation-allowlist.txt (drain-on-fix;
          # `probabilistic` rows are reported, not judged). Only the GapDiscovery mode runs here:
          # the class's regular slice (threads {1, 2} x 1) stays in the Compiler shards.
          - name: in-process-isolation
            filter: "Category=GapDiscovery&FullyQualifiedName~InProcessIsolation"

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      # Populates the NuGet package folder that the restored obj/*.nuget.g.props import from.
      run: dotnet restore
    - name: Download build output
      uses: actions/download-artifact@v8
      with:
        name: build-output
    - name: Unpack build output
      run: |
        set -o pipefail
        zstd -dc build-output.tar.zst | tar -xf -
        rm build-output.tar.zst
    - name: Sweep ${{ matrix.name }}
      run: dotnet test src/Sharpy.Compiler.Tests --no-build --verbosity normal --filter "${{ matrix.filter }}" --logger "trx;LogFileName=sweep-${{ matrix.name }}.trx" --results-directory TestResults
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: trx-sweep-${{ matrix.name }}
        path: TestResults/*.trx
        retention-days: 14
        if-no-files-found: warn

  sweeps-quick:
    # The four GapDiscovery sweeps that take 50-90 s each on CI (run 38983789798), one step each in
    # one job: as four jobs they cost four runner slots for ~4 min of tests. Each still writes its
    # own sweep-<name>.trx, and each reports even if an earlier one failed.
    name: Sweeps (interop, differential-execution, format-spec, formatter-emit)
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup Python
      # Required by both CPython oracles here: the differential-execution sweep
      # (DifferentialExecutionTests, #1156) compares compiled-program stdout against `python3`
      # running the same source, and the format-spec differential sweep compares against
      # batched `python3`. Pinned to 3.12 so behavior is stable. Both soft-skip if no suitable
      # python is found — so removing this step would not fail CI, it would silently disarm the
      # execution oracle's ratchet. Keep the pin.
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install oracle third-party modules
      # ORACLE_THIRD_PARTY (build_tools/differential_exec/run_programs.py) declares the
      # non-stdlib modules the execution oracle compares against CPython (currently PyYAML).
      # This install is load-bearing, not an optimization: the oracle's vacuity guard in
      # DifferentialExecutionTests FAILS (it does not skip) when a whitelisted module's
      # cells can never be compared because the children cannot import it — which is what
      # a runner without PyYAML produces. Keep this list in step with ORACLE_THIRD_PARTY.
      run: python -m pip install "pyyaml>=6,<7"
    - name: Restore dependencies
      # Populates the NuGet package folder that the restored obj/*.nuget.g.props import from.
      run: dotnet restore
    - name: Download build output
      uses: actions/download-artifact@v8
      with:
        name: build-output
    - name: Unpack build output
      id: unpack
      run: |
        set -o pipefail
        zstd -dc build-output.tar.zst | tar -xf -
        rm build-output.tar.zst
    - name: Sweep interop-conformance
      # Interop conformance sweep (#1034). Generated interop conformance sweep over every
      # public stdlib member. Emits .claude/tmp/interop-conformance-report.json; becomes a
      # ratchet once the reviewed allowlist
      # (src/Sharpy.Compiler.Tests/Conformance/interop-allowlist.txt) is present.
      if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
      run: dotnet test src/Sharpy.Compiler.Tests --no-build --verbosity normal --filter "Category=GapDiscovery&FullyQualifiedName~InteropConformance" --logger "trx;LogFileName=sweep-interop-conformance.trx" --results-directory TestResults
    - name: Sweep differential-execution
      # CPython differential execution oracle (#1202). Sharpy-compiled stdout vs batched
      # `python3` over the shared executable subset. Since #1202 the fixture arm sweeps its
      # ENTIRE eligible pool every run (565 cells, ~46 s on a dev machine) rather than a
      # 60-program sample that reached 4% of it, which is what moved it out of the main
      # Compiler step. Emits .claude/tmp/differential-exec-report.json — including the run's
      # own coverage % — and ratchets against the reviewed allowlist
      # (src/Sharpy.Compiler.Tests/Conformance/differential-exec-allowlist.txt), where every
      # entry cites a docs/deviations.yaml id or an issue number.
      # Needs the python steps above; the test soft-skips (green) without a suitable
      # python3, so a missing report means the oracle did not run, not that it agreed.
      if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
      run: dotnet test src/Sharpy.Compiler.Tests --no-build --verbosity normal --filter "Category=GapDiscovery&FullyQualifiedName~DifferentialExecution" --logger "trx;LogFileName=sweep-differential-execution.trx" --results-directory TestResults
    - name: Sweep format-spec-differential
      # Format-spec differential sweep (#1943, #1944, #1945). Generated PEP-3101 spec x
      # operand-kind cells (fixed-seed System.Random, 240 cells) compared byte-for-byte
      # against batched `python3`, ratcheting the reviewed allowlist
      # (src/Sharpy.Compiler.Tests/Conformance/format-spec-differential-allowlist.txt), where
      # every entry cites an issue and stale entries fail. The '#'-on-float gap (#1958) is
      # excluded at generation; the sweep soft-skips (green) without a suitable python3.
      # Excluded from the Compiler shards by name (COMPILER_MAIN_FILTER) so it runs exactly
      # once.
      if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
      run: dotnet test src/Sharpy.Compiler.Tests --no-build --verbosity normal --filter "Category=GapDiscovery&FullyQualifiedName~FormatSpecDifferential" --logger "trx;LogFileName=sweep-format-spec-differential.trx" --results-directory TestResults
    - name: Sweep formatter-emit-invariance
      # Formatter emit-invariance sweep (#2062, #2068). Every executing single-file fixture
      # P: the Roslyn-normalised C# of Format(P) equals P's with every #line directive line
      # removed (~2,400 fixtures, compiled to C# in process, ~30 s on a dev machine). Emits
      # .claude/tmp/formatter-emit-invariance-report.json and ratchets the `emitChanged`
      # section of src/Sharpy.Compiler.Tests/Conformance/
      # formatter-meaning-preservation-allowlist.txt (drain-on-fix). The parse-level twin
      # sweep (FormatterMeaningPreservationSweepTests) runs inline in the Compiler shards;
      # this one is excluded there by name so it runs exactly once.
      if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
      run: dotnet test src/Sharpy.Compiler.Tests --no-build --verbosity normal --filter "Category=GapDiscovery&FullyQualifiedName~FormatterEmitInvariance" --logger "trx;LogFileName=sweep-formatter-emit-invariance.trx" --results-directory TestResults
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: trx-sweeps-quick
        path: TestResults/*.trx
        retention-days: 14
        if-no-files-found: warn

  stdlib-spy-gates:
    name: Stdlib .spy compile + staleness gates
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Download build output
      uses: actions/download-artifact@v8
      with:
        name: build-output
    - name: Unpack build output
      # `dotnet run` below restores and incrementally builds as it did in the sequential job;
      # the checkout's fresh source mtimes may make that build non-trivial here (time only).
      run: |
        set -o pipefail
        zstd -dc build-output.tar.zst | tar -xf -
        rm build-output.tar.zst
    - name: Verify .spy stdlib native compilation
      run: dotnet run --project src/Sharpy.Cli -- project src/Sharpy.Stdlib/spy/stdlib.spyproj
    - name: Verify .spy stdlib C# staleness
      run: bash build_tools/check_spy_staleness.sh
    - name: Verify .spy test C# staleness
      run: bash build_tools/check_spy_tests_staleness.sh
    - name: Log per-module stdlib assembly sizes
      run: |
        echo "=== Per-module stdlib assembly sizes (net10.0) ==="
        find src/Sharpy.Stdlib/modules/bin -name "Sharpy.Stdlib.*.dll" -path "*/net10.0/*" \
          | sort \
          | while read f; do
              size=$(stat --format="%s" "$f" 2>/dev/null || stat -f "%z" "$f" 2>/dev/null)
              printf "  %-40s %s bytes\n" "$(basename "$f")" "$size"
            done
        echo "=== Monolith size ==="
        monolith="src/Sharpy.Stdlib/bin/Debug/net10.0/Sharpy.Stdlib.dll"
        if [ -f "$monolith" ]; then
          size=$(stat --format="%s" "$monolith" 2>/dev/null || stat -f "%z" "$monolith" 2>/dev/null)
          printf "  %-40s %s bytes\n" "$(basename "$monolith")" "$size"
        fi

  shard-partition:
    name: Shard partition check (compiler, lsp)
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Download build output
      uses: actions/download-artifact@v8
      with:
        name: build-output
    - name: Unpack build output
      run: |
        set -o pipefail
        zstd -dc build-output.tar.zst | tar -xf -
        rm build-output.tar.zst
    - name: Verify the shards partition the main-step filter
      # Per suite, lists (does not run) the tests selected by its main filter and by each
      # main&<prefix><n>, and fails unless the sorted concatenation of the shard lists equals the
      # main list (no test dropped, none double-run) and no shard is empty. Both suites are checked
      # even if the first fails.
      # Names are compared as a multiset: xUnit truncates long theory arguments in display names,
      # but rows sharing a truncated name share a FullyQualifiedName and so always share a shard.
      run: |
        set -uo pipefail
        list() {
          dotnet test "$1" --no-build --list-tests --filter "$2" > list.out || return 1
          sed -n 's/^    //p' list.out | LC_ALL=C sort
        }
        check() {
          local project=$1 main=$2 prefix=$3 n var count shards
          echo "== $prefix<n> against $main ($project)"
          list "$project" "${!main}" > main.txt || { echo "::error::listing $main failed"; return 1; }
          : > union.txt
          shards=$(compgen -v "$prefix" | sed "s/^$prefix//" | sort -n)
          for n in $shards; do
            var="$prefix$n"
            list "$project" "${!main}&${!var}" > "shard-$n.txt" || { echo "::error::listing $var failed"; return 1; }
            count=$(wc -l < "shard-$n.txt")
            echo "shard $n: $count"
            if [ "$count" -eq 0 ]; then echo "::error::$var selects no tests"; return 1; fi
            cat "shard-$n.txt" >> union.txt
          done
          LC_ALL=C sort union.txt -o union.txt
          echo "main filter: $(wc -l < main.txt); sum of shards: $(wc -l < union.txt)"
          if [ "$(wc -l < main.txt)" -eq 0 ]; then echo "::error::$main lists no tests"; return 1; fi
          if ! cmp -s main.txt union.txt; then
            echo "::error::the $prefix<n> shards do not partition $main (< only in main = dropped, > only in shards = double-run)"
            diff main.txt union.txt | head -100 || true
            return 1
          fi
        }
        status=0
        check src/Sharpy.Compiler.Tests COMPILER_MAIN_FILTER COMPILER_SHARD_ || status=1
        check src/Sharpy.Lsp.Tests LSP_MAIN_FILTER LSP_SHARD_ || status=1
        exit $status

  windows:
    # #2291 (R-GH): the one host the rest of CI never runs. Roslyn's debug-information default is
    # host-dependent (the native Windows PDB on Windows, whose writer sharpyc does not ship), so the
    # debug-format guard runs here on every push, and the README's hello world runs on the SAME
    # self-contained win-x64 publish the release ships. Builds from source: the ubuntu
    # build-output tarball is not a Windows build.
    name: Windows (debug-info guard + published hello world)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Debug-information guard and line-directive tests
      run: >
        dotnet test src/Sharpy.Compiler.Tests --verbosity normal
        --filter "FullyQualifiedName~DebugInformationFormatTests|FullyQualifiedName~LineDirectiveRuntimeTests|FullyQualifiedName~DotnetHostTests"
        --logger "trx;LogFileName=windows.trx" --results-directory TestResults
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: trx-windows
        path: TestResults/*.trx
        retention-days: 14
        if-no-files-found: warn
    - name: Publish sharpyc as the release does (win-x64, self-contained)
      if: ${{ !cancelled() }}
      run: dotnet publish src/Sharpy.Cli -c Release --self-contained -r win-x64 -o publish/cli
    - name: README hello world on the published sharpyc
      if: ${{ !cancelled() }}
      shell: bash
      run: build_tools/smoke_hello.sh "$PWD/publish/cli/sharpyc.exe"
    # #2292 (R-GM): Windows looks `dotnet` up as dotnet.exe on a ;-separated PATH — the one host whose
    # lookup the ubuntu jobs never exercise. With no dotnet, `run` refuses with SPY0913 before compiling.
    - name: README hello world on the published sharpyc with no dotnet on PATH
      if: ${{ !cancelled() }}
      shell: bash
      run: build_tools/smoke_hello.sh --no-dotnet "$PWD/publish/cli/sharpyc.exe"

  ci-summary:
    name: CI summary
    if: ${{ always() }}
    needs: [changes, format, build, test-fast, lsp, compiler, sweep, sweeps-quick, stdlib-spy-gates, shard-partition, windows]
    runs-on: ubuntu-latest
    env:
      # 'false' on a README.md-only change (see `changes`): only the windows job ran.
      CODE: ${{ needs.changes.outputs.code }}

    steps:
    - name: Download test results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: trx-*
        path: trx
        merge-multiple: true
    - name: Per-assembly and per-sweep test counts
      # Prints Total / Passed / Failed / Skipped per trx (to the log and the run summary) for
      # comparison against a sequential control run, and fails if an expected trx is missing or
      # reports zero tests (a --no-build run that silently discovered nothing). Below the counts,
      # the slowest test classes by wall span: the data shard balancing reads (xUnit runs one
      # class's cases one at a time, so a class's span is a floor on its shard's wall clock).
      if: ${{ !cancelled() }}
      run: |
        python3 - <<'PY'
        import glob, os, re, sys
        from datetime import datetime
        import xml.etree.ElementTree as ET
        NS = "{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}"
        def shards(prefix):
            return sorted(int(k[len(prefix):]) for k in os.environ if k.startswith(prefix))
        sweeps = ["interop-conformance", "metamorphic-corpus", "differential-execution",
                  "format-spec-differential", "formatter-emit-invariance", "in-process-isolation"]
        expected = (["cli", "core", "stdlib", "windows"] + [f"lsp-shard-{n}" for n in shards("LSP_SHARD_")]
                    + [f"compiler-shard-{n}" for n in shards("COMPILER_SHARD_")] + [f"sweep-{s}" for s in sweeps])
        if os.environ.get("CODE") == "false":
            expected = ["windows"]
        found = {os.path.basename(p)[:-4]: p for p in glob.glob("trx/**/*.trx", recursive=True)}
        rows, problems, classes = [], [], []
        sums = {"compiler": [0, 0, 0, 0], "lsp": [0, 0, 0, 0]}
        def stamp(s):
            # trx stamps carry 7 fractional digits; fromisoformat takes at most 6 before Python 3.11.
            return datetime.fromisoformat(re.sub(r"(\.\d{6})\d+", r"\1", s))
        def seconds(d):
            h, m, sec = d.split(":")
            return int(h) * 3600 + int(m) * 60 + float(sec)
        for name in expected + sorted(set(found) - set(expected)):
            if name not in found:
                problems.append(f"{name}: no trx")
                rows.append((name, "-", "-", "-", "-"))
                continue
            root = ET.parse(found[name]).getroot()
            c = root.find(f"{NS}ResultSummary/{NS}Counters")
            # Skipped is NOT Counters/@notExecuted: the trx logger leaves that 0 for xUnit skips
            # (measured on run 37162960837); a skipped test is a UnitTestResult whose outcome is
            # NotExecuted, so count those.
            skipped = sum(1 for r in root.iter(f"{NS}UnitTestResult") if r.get("outcome") == "NotExecuted")
            vals = [int(c.get(a, "0")) for a in ("total", "passed", "failed")] + [skipped]
            if vals[0] == 0:
                problems.append(f"{name}: zero tests")
            for suite in sums:
                if name.startswith(f"{suite}-shard-"):
                    sums[suite] = [m + v for m, v in zip(sums[suite], vals)]
            rows.append((name, *vals))
            owner = {t.get("id"): t.find(f"{NS}TestMethod").get("className") for t in root.iter(f"{NS}UnitTest")}
            per = {}
            for r in root.iter(f"{NS}UnitTestResult"):
                if r.get("startTime") is None or r.get("endTime") is None:
                    continue
                k = per.setdefault(owner.get(r.get("testId"), "?"), [0, 0.0, None, None])
                start, end = stamp(r.get("startTime")), stamp(r.get("endTime"))
                k[0] += 1
                k[1] += seconds(r.get("duration", "0:0:0"))
                k[2] = start if k[2] is None else min(k[2], start)
                k[3] = end if k[3] is None else max(k[3], end)
            classes += [(name, cls, n, busy, (end - start).total_seconds()) for cls, (n, busy, start, end) in per.items()]
        for suite, total in sums.items():
            rows.append((f"{suite} (sum of shards)", *total))
        lines = ["| trx | Total | Passed | Failed | Skipped |", "|---|---:|---:|---:|---:|"]
        lines += [f"| {r[0]} | {r[1]} | {r[2]} | {r[3]} | {r[4]} |" for r in rows]
        classes.sort(key=lambda c: -c[4])
        lines += ["", "<details><summary>Slowest test classes (wall span = first start to last end)</summary>", "",
                  "| trx | class | tests | span (s) | summed (s) |", "|---|---|---:|---:|---:|"]
        lines += [f"| {t} | {cls} | {n} | {span:.0f} | {busy:.0f} |" for t, cls, n, busy, span in classes[:25]]
        lines += ["", "</details>"]
        print("\n".join(lines))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
            f.write("\n".join(lines) + "\n")
        for p in problems:
            print(f"::error::{p}")
        sys.exit(1 if problems else 0)
        PY
    - name: Fail unless every needed job succeeded
      if: ${{ always() }}
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        # A README.md-only change skips every job under `changes` but windows (see `changes`).
        ok='["success"]'
        if [ "$CODE" = "false" ]; then ok='["success", "skipped"]'; fi
        bad=$(echo "$NEEDS" | jq --argjson ok "$ok" '[to_entries[] | select(.value.result as $r | $ok | index($r) | not)] | length')
        if [ "$bad" -ne 0 ]; then echo "::error::$bad needed job(s) did not succeed"; exit 1; fi
