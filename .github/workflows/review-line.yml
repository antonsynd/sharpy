# Independent-review line check (README item 6; `/implement-plan` > Cleanup and Report step 4): a pull
# request into `dev` that changes code carries `Independent review @ <sha>: <verdict>; ...` in its body,
# with a verdict other than `do not merge`, reviewed shas that are ancestors of the head, and no code
# commit after the point the line covers. build_tools/check_review_line.py decides; its docstring lists
# the verdicts, the exemptions (base not `dev`, head `dev`, bot authors, no code path changed) and what
# it does not judge (that the review was independent, that the fixes were read, the counts).
#
# ADVISORY as shipped: the check `review-line` is not in the `dev` ruleset's required set; making it
# required is the owner's ruleset change. A draft PR is judged but never failed (a warning), so work
# in progress stays green; marking it ready re-runs the check.
#
# Its own workflow, not a job in commit-subjects.yml: the body changes without a push, so this runs on
# `edited` too, and re-running the required `subjects` check on every body edit would be noise.
#
# Injection: the body, the branch names and the author reach the script through env only; no PR text is
# interpolated into the shell. The token reads the repository and nothing else.
name: Review Line

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: review-line-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-line:
    name: review-line
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7
      with:
        # The reviewed shas, the base and the head must all be in the clone for the ancestry and
        # staleness questions.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version

    - name: Check the independent-review line
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
        DRAFT: ${{ github.event.pull_request.draft }}
      run: |
        args=(--base "$BASE_SHA" --head "$HEAD_SHA" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --author "$AUTHOR")
        if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
        python3 build_tools/check_review_line.py "${args[@]}"
