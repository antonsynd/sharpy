# Nightly soak: the property tests on a per-call time budget and the fuzz suite at a higher scale,
# both on fresh seeds, past what a PR run affords. Any red is a compiler bug or a test gap: the job
# fails and uploads the console log, TRX and blame dumps as a workflow artifact.
#
# Mutation testing (Stryker, #2289) is NOT here: the Lexer pilot alone took 7 h 23 min with a
# 22.1 GB peak (docs/audits/stryker-lexer-pilot-2026-10-11.md), past a hosted job's 6 h and 16 GB.
# It stays owner-triggered via build_tools/stryker/run.sh.
#
# Scheduled runs fire from the workflow file on the default branch (mainline), but soak `dev`,
# where work lands first. A failure email goes to whoever last edited the cron line.
name: Nightly

on:
  schedule:
    - cron: '23 4 * * *'   # 04:23 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or sha to soak
        default: dev
      seconds_per_property:
        description: CsCheck_Time, the seconds each property sample runs
        default: '15'
      fuzz_scale:
        description: SHARPY_FUZZ_SCALE, the multiplier on every fuzz loop
        default: '300'

permissions:
  contents: read

jobs:
  properties:
    name: properties (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Sharpy.Compiler.Tests
            filter: "Category=RandomProperty|Category=Property"
          # These three have a handful of CsCheck samples, not all tagged, so they run whole.
          - project: Sharpy.Core.Tests
            filter: "Category!=Benchmark"
          - project: Sharpy.Stdlib.Tests
            filter: "Category!=Benchmark"
          - project: Sharpy.Lsp.Tests
            filter: "Category!=Benchmark"
    env:
      # Most samples pass an explicit `iter:`, which CsCheck_Iter does not override. CsCheck_Time
      # does: every sample that passes no `time:` (none in src/ do) runs for this many seconds.
      # CsCheck picks a fresh seed per run and prints the failing one.
      CsCheck_Time: ${{ inputs.seconds_per_property || '15' }}
      # The injection lanes sample this many programs instead of 100 (PropertyIterations.cs).
      SHARPY_PROPERTY_ITER: '600'
      # The numeric-literal twin fails instead of skipping without a Python 3.12+ oracle.
      SHARPY_REQUIRE_PYTHON_ORACLE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'dev' }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup Python
        # The differential-parse and execution oracles, pinned as in dotnet10.yml.
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install oracle third-party modules
        run: python -m pip install "pyyaml>=6,<7"
      - name: Build
        run: dotnet build src/${{ matrix.project }}
      - name: Property soak
        run: |
          set -o pipefail
          dotnet test src/${{ matrix.project }} --no-build \
            --filter "${{ matrix.filter }}" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=nightly.trx" \
            --results-directory TestResults \
            --blame-crash --blame-hang --blame-hang-timeout 20m \
            2>&1 | tee nightly.log
      - name: Upload log and reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-properties-${{ matrix.project }}
          path: |
            nightly.log
            TestResults/
          retention-days: 30

  fuzz:
    name: fuzz (scale ${{ inputs.fuzz_scale || '300' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SHARPY_FUZZ_SCALE: ${{ inputs.fuzz_scale || '300' }}
      # A new salt each run, so each night draws inputs no PR run draws. A failure message names
      # the salt; re-run locally with the same SHARPY_FUZZ_SALT to reproduce it (FuzzBudget.cs).
      SHARPY_FUZZ_SALT: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'dev' }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/Sharpy.Compiler.Tests
      - name: Fuzz soak
        run: |
          set -o pipefail
          dotnet test src/Sharpy.Compiler.Tests --no-build \
            --filter "FullyQualifiedName~Sharpy.Compiler.Tests.Fuzz.FuzzTests" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=fuzz.trx" \
            --results-directory TestResults \
            --blame-crash --blame-hang --blame-hang-timeout 20m \
            2>&1 | tee fuzz.log
      - name: Upload log and reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-fuzz
          path: |
            fuzz.log
            TestResults/
          retention-days: 30
