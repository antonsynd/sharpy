name: Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-core:
    name: Build Sharpy.Core (netstandard2.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Sharpy.Core
        run: dotnet publish src/Sharpy.Core -f netstandard2.1 -c Release -o publish/core

      - name: Package Sharpy.Core
        run: |
          cd publish/core
          zip -r ../../sharpy-core-netstandard2.1.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sharpy-core
          path: sharpy-core-netstandard2.1.zip

  build-stdlib:
    name: Build Sharpy.Stdlib (netstandard2.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Sharpy.Stdlib
        run: dotnet publish src/Sharpy.Stdlib -f netstandard2.1 -c Release -o publish/stdlib

      - name: Package Sharpy.Stdlib
        run: |
          cd publish/stdlib
          zip -r ../../sharpy-stdlib-netstandard2.1.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sharpy-stdlib
          path: sharpy-stdlib-netstandard2.1.zip

  build-cli:
    name: Build sharpyc (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive: tar.gz
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish sharpyc
        run: >
          dotnet publish src/Sharpy.Cli
          -c Release
          --self-contained
          -r ${{ matrix.rid }}
          -o publish/cli

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf sharpyc-${{ matrix.rid }}.tar.gz -C publish/cli .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/cli/* -DestinationPath sharpyc-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sharpyc-${{ matrix.rid }}
          path: sharpyc-${{ matrix.rid }}.${{ matrix.archive }}

  nuget-pack:
    name: Pack NuGet packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify tag matches SharpyVersion
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          BASE_VERSION="${VERSION%%-*}"
          PROPS_VERSION=$(sed -n 's:.*<SharpyVersion>\(.*\)</SharpyVersion>.*:\1:p' Directory.Build.props)
          if [ "$BASE_VERSION" != "$PROPS_VERSION" ]; then
            echo "::error::Tag version '$VERSION' does not match SharpyVersion '$PROPS_VERSION' in Directory.Build.props — the packed tool would report a stale --version. Run /bump-version before tagging."
            exit 1
          fi

      - name: Pack all publishable projects
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          dotnet pack src/Sharpy.Cli -c Release -o packages/ "/p:Version=$VERSION"
          dotnet pack src/Sharpy.Core -c Release -o packages/ "/p:Version=$VERSION"
          dotnet pack src/Sharpy.Stdlib -c Release -o packages/ "/p:Version=$VERSION"
          dotnet pack src/Sharpy.Compiler -c Release -o packages/ "/p:Version=$VERSION"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: packages/*.nupkg

  # #2291 (R-GH): every published artifact is RUN on its own platform before anything ships.
  # v0.22.0's win-x64 archive was built on windows-latest and never executed; its first command,
  # the README's `sharpyc run hello.spy`, failed (SPY0908 CS0041, the native Windows PDB writer).
  # Each archive runs on a runner of its own OS and architecture; `release` and `nuget-push` wait
  # for both smoke jobs, so a broken artifact is neither attached nor pushed.
  smoke-archive:
    name: Smoke sharpyc archive (${{ matrix.rid }})
    needs: [build-cli]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz
          - rid: osx-x64
            os: macos-15-intel
            archive: tar.gz
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # `sharpyc run` launches the compiled program with `dotnet`: the README's prerequisite.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download archive
        uses: actions/download-artifact@v8
        with:
          name: sharpyc-${{ matrix.rid }}

      - name: Unpack (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: mkdir sharpyc && tar -xzf sharpyc-${{ matrix.rid }}.tar.gz -C sharpyc

      - name: Unpack (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Expand-Archive -Path sharpyc-${{ matrix.rid }}.zip -DestinationPath sharpyc

      - name: README hello world on the archive
        shell: bash
        run: build_tools/smoke_hello.sh "$PWD/sharpyc/sharpyc${{ runner.os == 'Windows' && '.exe' || '' }}"

  smoke-tool:
    name: Smoke sharpyc dotnet tool (${{ matrix.os }})
    needs: [nuget-pack]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: packages/

      - name: Install the packed tool (the README's `dotnet tool install` channel)
        shell: bash
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          dotnet tool install sharpyc --version "$VERSION" --add-source packages --tool-path "$RUNNER_TEMP/sharpyc-tool"

      - name: README hello world on the tool
        shell: bash
        run: build_tools/smoke_hello.sh "$RUNNER_TEMP/sharpyc-tool/sharpyc${{ runner.os == 'Windows' && '.exe' || '' }}"

  nuget-push:
    name: Push to NuGet
    needs: [nuget-pack, smoke-archive, smoke-tool]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: packages/

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          for pkg in packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  release:
    name: Create GitHub Release
    needs: [build-core, build-stdlib, build-cli, nuget-pack, smoke-archive, smoke-tool]
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: the notes are generated from the commits between
      # the previous tag and this one (GitHub's --generate-notes lists merged
      # PRs only, which here are just Dependabot's).
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release range
        id: range
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            echo "range=$PREV..$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "range=$TAG" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes (git-cliff, cliff.toml)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.range.outputs.range }} --tag ${{ steps.range.outputs.tag }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.range.outputs.tag }}"
          PRERELEASE_FLAG=""
          if echo "$TAG" | grep -qE '[-](alpha|beta|rc)'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              $PRERELEASE_FLAG \
              artifacts/*
          fi
