version: 2

updates:
  # Keep GitHub Actions up to date (if/when workflows exist)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "America/New_York"
    target-branch: "dev"
    labels: ["dependencies", "github-actions"]
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore"
      include: "scope"

  # .NET (NuGet) — scans all projects under the repo (includes /src and /dotnet)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "America/New_York"
    target-branch: "dev"
    labels: ["dependencies", "dotnet", "nuget"]
    open-pull-requests-limit: 10
    # Packages versioned with .NET stay on 10.x while the projects target net10.0;
    # version 11 waits for the net11.0 target (#2548). 11.0.0 of
    # System.Collections.Immutable collides with net10's built-in copy (CS0433, #2713).
    ignore:
      - dependency-name: "Microsoft.AspNetCore.Components.WebAssembly"
        versions: [">= 11"]
      - dependency-name: "Microsoft.AspNetCore.Components.WebAssembly.DevServer"
        versions: [">= 11"]
      - dependency-name: "Microsoft.Bcl.AsyncInterfaces"
        versions: [">= 11"]
      - dependency-name: "Microsoft.Data.Sqlite"
        versions: [">= 11"]
      - dependency-name: "Microsoft.Extensions.FileSystemGlobbing"
        versions: [">= 11"]
      - dependency-name: "System.Collections.Immutable"
        versions: [">= 11"]
    # Group some common packages to reduce PR noise
    groups:
      test-dependencies:
        patterns:
          - "xunit"
          - "xunit.runner.visualstudio"
          - "FluentAssertions"
          - "Microsoft.NET.Test.Sdk"
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis.*"
    commit-message:
      prefix: "chore"
      include: "scope"

  # VS Code extension (npm). Until this entry, only security updates opened PRs here (to mainline,
  # and they do not take the options below). The fix for alert 78 (minimatch, GHSA-g3hv-75wg-m249)
  # waits for vscode-languageclient and @vscode/vsce releases that accept minimatch 11.
  - package-ecosystem: "npm"
    directory: "/editors/vscode"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "America/New_York"
    target-branch: "dev"
    labels: ["dependencies", "javascript"]
    open-pull-requests-limit: 5
    # Bumps known to break the extension build (vscode-extension.yml, which runs on these PRs) are
    # held rather than opened red:
    # - @types/vscode: vsce refuses to package when its range passes engines.vscode (^1.91.0) at
    #   major.minor, and Dependabot rewrites the range to the new version, so no bump is safe.
    # - @types/node: the extension host of VS Code 1.91 runs Node 20.
    # - typescript: 6 and 7 fail lint, bundle and vsce (TS2591) without a tsconfig change.
    # - @vscode/vsce: 4 declares engines.node >= 22; the workflow runs Node 20.
    ignore:
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vscode/vsce"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
