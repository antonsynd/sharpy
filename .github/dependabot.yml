version: 2

updates:
  # Keep GitHub Actions up to date (if/when workflows exist)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "America/New_York"
    target-branch: "dev"
    labels: ["dependencies", "github-actions"]
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore"
      include: "scope"

  # .NET (NuGet) — scans all projects under the repo (includes /src and /dotnet)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "America/New_York"
    target-branch: "dev"
    labels: ["dependencies", "dotnet", "nuget"]
    open-pull-requests-limit: 10
    # Packages versioned with .NET stay on 10.x while the projects target net10.0;
    # version 11 waits for the net11.0 target (#2548). 11.0.0 of
    # System.Collections.Immutable collides with net10's built-in copy (CS0433, #2713).
    ignore:
      - dependency-name: "Microsoft.AspNetCore.Components.WebAssembly"
        versions: [">= 11"]
      - dependency-name: "Microsoft.AspNetCore.Components.WebAssembly.DevServer"
        versions: [">= 11"]
      - dependency-name: "Microsoft.Bcl.AsyncInterfaces"
        versions: [">= 11"]
      - dependency-name: "Microsoft.Data.Sqlite"
        versions: [">= 11"]
      - dependency-name: "Microsoft.Extensions.FileSystemGlobbing"
        versions: [">= 11"]
      - dependency-name: "System.Collections.Immutable"
        versions: [">= 11"]
    # Group some common packages to reduce PR noise
    groups:
      test-dependencies:
        patterns:
          - "xunit"
          - "xunit.runner.visualstudio"
          - "FluentAssertions"
          - "Microsoft.NET.Test.Sdk"
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis.*"
    commit-message:
      prefix: "chore"
      include: "scope"

  # VS Code extension (npm). Without this entry no bump is proposed for editors/vscode, e.g. the
  # vscode-languageclient release that accepts minimatch 11 (GHSA-g3hv-75wg-m249, alert 78).
  - package-ecosystem: "npm"
    directory: "/editors/vscode"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "America/New_York"
    target-branch: "dev"
    labels: ["dependencies", "javascript"]
    open-pull-requests-limit: 5
    # @types/vscode must not pass engines.vscode (^1.91.0): vsce refuses to package when it does.
    # @types/node follows the Node the workflow uses (20).
    ignore:
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
