        where: [docs/process/README.md, build_tools/check_review_line.py, .github/workflows/review-line.yml]
        source: "owner, 2026-11-11 (process README item 6)"
        predicted: none recorded
        state: live
        outcome: not-held
        judged: 2026-11-27
        note: >-
          The line was current on 6 of 6 merged PRs. #2796 had four reviews, each "merge after
          fixes", and merged with the regression filed as #2806. More rounds re-read the same matrix.
      - date: 2026-11-20
        what: >-
          The review of a behaviour change names the neighbouring kind of every operand the diff
          touches (other backing type, None on each side, a user dunder, a stateful operand, a CLR
          conversion) and runs base and head.
        where: [docs/process/handoff-2026-11-17-arc.md, .claude/skills/implement-plan/SKILL.md]
        source: "handoff-2026-11-17-arc.md sections 5 and 7, decision 4"
        predicted: none recorded
        state: live
        outcome: not-held
        judged: 2026-11-27
        note: >-
          #2806's axis is not among the five named kinds: a formal typed by a type parameter beside
          a concrete one. The one review that added that axis found it.
    observed:
      - {date: 2026-11-17, sha: af14cc69f, value: "4 in the week (#2679 x2, #2682 x2)", by: handoff-2026-11-17-arc.md section 3}
      - {date: 2026-11-27, sha: a5fac608e, value: "1 class in 1 behaviour PR (#2796, filed as #2806)", by: health watch 2026-11-27}

  - id: M3
    name: The text a session must read grows faster than behaviour is fixed.
    measure: >-
      Read set: the bytes of CLAUDE.md, docs/process/README.md, docs/design/verification-contract.md
      and every .claude/skills/*/SKILL.md. Procedure key and CLAUDE.md: `python3
      build_tools/scorecard_metrics.py --check`.
    wanted: read set not up; procedure key down; CLAUDE.md at most 8 KB
    attempts:
      - date: 2026-11-11
        what: A ratchet on the counted procedure key (CLAUDE.md and eight skills) and on CLAUDE.md bytes; a raise is the owner's.
        where: [build_tools/scorecard_metrics.py, build_tools/scorecard-baseline.json]
        source: "commit dbe31fa1f"
        predicted: none recorded
        state: live
        outcome: not-held
        judged: 2026-11-27
        note: >-
          Both counted values fell, which is all a ratchet can do. Against `wanted` it has not held:
          CLAUDE.md is still above 8 KB.
      - date: 2026-11-17
        what: "A rule with no counter: the read set is not up; a new skill or section deletes as much as it adds."
        where: [docs/process/handoff-2026-11-17-arc.md]
        source: handoff-2026-11-17-arc.md section 3
        predicted: none recorded
        state: live
        outcome: not-held
        judged: 2026-11-27
        note: >-
          The counted part fell and the uncounted part rose. Two process documents landed outside
          every count in the same period (docs/process/blast-radius.md, docs/process/rulings/README.md).
    observed:
      - {date: 2026-11-17, sha: af14cc69f, value: "read set 299,372 (286,358 at the previous handoff); procedure key 143,159; CLAUDE.md 9,304", by: handoff-2026-11-17-arc.md sections 1 and 3}
      - {date: 2026-11-27, sha: a5fac608e, value: "read set 301,323; procedure key 142,673; CLAUDE.md 9,205", by: health watch 2026-11-27}

