  - id: M7
    name: A ruling record can claim the owner decided it without the owner's words behind it.
    measure: "`python3 build_tools/check_rulings.py`, and a reviewer's mutation of an owner quote"
    wanted: a record that names the owner fails the check unless its words are the charter row's
    attempts:
      - date: 2026-11-24
        what: check_rulings.py requires `decided_by` and fails an owner-required decision an agent took.
        where: [build_tools/check_rulings.py]
        source: "PR #2785"
        predicted: none recorded
        state: live
        outcome: not-held
        judged: 2026-11-27
        note: >-
          Writing `decided_by: owner` met it. A reviewer rewrote R-RO's quote to its opposite and the
          check stayed green.
      - date: 2026-11-27
        what: >-
          An owner-decided record carries `source` and `owner_words`; each entry must equal a quote
          in the charter row's lead cell, and a test pins each record's words by digest.
        where: [build_tools/check_rulings.py, build_tools/tests/test_check_rulings.py]
        source: "PR #2808; PR #2809"
        predicted: A changed word in a quote, or a new owner record with no quoted row, turns the check red.
        state: live
        outcome: unjudged
        note: It ties the record to the row. It does not prove who spoke.
    observed:
      - {date: 2026-11-27, sha: a5fac608e, value: "a copied one-way ruling marked decided_by owner: exit 0; a quote rewritten to its opposite: green", by: health watch 2026-11-27}
      - {date: 2026-11-27, sha: 4b1827a8f, value: "0 new, 0 stale, 10 known findings; both of the lane reviewer's mutations red", by: health watch 2026-11-27}

  - id: M8
    name: A session changes a process mechanism without seeing which problem it answers or what was tried before.
    measure: "/health-watch: the mechanism changes merged since the last check, and how many arrived with a ledger attempt"
    wanted: every mechanism change arrives with its attempt and a prediction; a mechanism that has not held is changed or removed
    attempts:
      - date: 2026-11-27
        what: >-
          This ledger, read whole before a mechanism is changed and at each health check, with a
          check that refuses a lost attempt or observation and a new attempt with no prediction.
        where:
          - docs/process/rulings/mechanisms.yaml
          - build_tools/tests/test_mechanisms_ledger.py
          - docs/process/README.md
          - .claude/skills/health-watch/SKILL.md
        source: "owner, 2026-11-27 (session): \"i do want it, i agree with you recs and analysis\""
        predicted: >-
          By the second health check after it merges, both of these: (a) at least one pull request
          that changes a file under .claude/hooks, .claude/skills, build_tools/check_*.py,
          build_tools/scorecard-baseline.json, CLAUDE.md, docs/process/README.md or
          docs/design/verification-contract.md has merged, and every such pull request added an
          attempt here; (b) at least one attempt recorded as not-held has been changed or replaced,
          or the owner has ruled on its removal. If either fails, the ledger is required reading
          that changed nothing and should itself go (M3).
        state: live
        outcome: unjudged
    observed:
      - {date: 2026-11-27, sha: 4b1827a8f, value: "context, not this measure (there is no window before the ledger): 0 of 6 hooks and 6 of 8 check scripts cite the issue or ruling behind them; 10 of the 11 seeded attempts had no recorded prediction", by: health watch 2026-11-27}
