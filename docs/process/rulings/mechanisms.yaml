# The process mechanisms tried against each recurring process problem, and what was measured after.
# (Owner, 2026-11-27: "i do want it, i agree with you recs and analysis".)
#
# Why it exists: a rule, cap, gate or ratchet says what to do, not which problem it answers, what
# was tried before it, or whether it worked. A session that changes one without that history repeats
# an earlier attempt or tightens a guard whose reason it cannot see. The shape follows
# arXiv:2611.18856, where a memory of root causes alone gave mixed results and the attempts with
# their predicted and observed outcomes scored highest (one run per condition outside coding).
#
# Who reads it: a session about to add, change or remove a process mechanism (a rule in CLAUDE.md,
# docs/process or a skill, a hook, a check script, a ratchet, a stop rule) reads ALL of it first,
# and so does /health-watch at each check. Workers on product code do not. It is not in the counted
# read set, so its bytes are a cost no ratchet sees: keep an entry to what the next change needs.
#
# Who writes it:
#   - The session that adds or changes a mechanism appends an attempt to the problem it answers (a
#     new problem only when none explains the failure), in the same pull request, with `predicted`
#     written before the first measurement. An attempt is never deleted or reworded: a mechanism
#     that is replaced or removed keeps its record with `state: replaced` or `removed`. This pull
#     request's own mechanism is M8.
#   - /health-watch proposes `observed` rows and each live attempt's `outcome` in its health-page
#     entry; they land here by pull request on the owner's ask. It proposes removal of a mechanism
#     that has not held; removal is the owner's.
#
# The check is `pytest build_tools/tests/test_mechanisms_ledger.py`. What a field means:
#   date       the day the mechanism took effect: its ruling, or its merge
#   where      the files that carry it today; each must exist while `state: live`
#   predicted  what it was expected to change. `none recorded` stands only on the attempts of the
#              seed; the check refuses it on an attempt the base branch does not have
#   outcome    held | not-held | unjudged, against `predicted`, or against the problem's `wanted`
#              when none was recorded; `judged` is the date of the observation it was judged on
#   frozen     once merged, an attempt's date, what, source and predicted and every observed row
#              never change; where, state, outcome, judged, note and a problem's own text can
#   order      attempts and observed rows are in date order; `sha` is the commit measured

problems:
  - id: M1
    name: A plan does not converge in /verify-plan; passes repeat and the plan stays a draft.
    measure: "`python3 build_tools/check_plan_refs.py docs/process/plans/<plan>.md`, the caps (R-LW) line"
    wanted: at most 2 verify passes per plan
    attempts:
      - date: 2026-11-08
        what: A cap of two verify passes before the open finding goes to the owner, as a charter fact.
        where: [docs/process/rounds/remediation-round-2026-09-20-batching.md, build_tools/check_plan_refs.py]
        source: R-LW
        predicted: none recorded
        state: live
        outcome: not-held
        judged: 2026-11-17
      - date: 2026-11-17
        what: >-
          A stop rule: a second pass that stamps NEEDS REVISION sends the open finding to the owner as
          a decision, and no further pass is offered unless the owner asks.
        where: [docs/process/handoff-2026-11-17-arc.md]
        source: "PR #2725; handoff-2026-11-17-arc.md section 4"
        predicted: none recorded
        state: live
        outcome: not-held
        judged: 2026-11-27
        note: >-
          The rule was followed as written: passes 3 to 6 of P78 each ran on the owner's word. The
          count still passed the cap, so asking the owner for another pass is not what limits it.
    observed:
      - {date: 2026-11-17, sha: af14cc69f, value: "6, 2, 5 over three plans", by: handoff-2026-11-17-arc.md section 3}
      - {date: 2026-11-27, sha: 4b1827a8f, value: "P78: 6, still a draft, body 20,476 of 20,480 bytes", by: health watch 2026-11-27}

