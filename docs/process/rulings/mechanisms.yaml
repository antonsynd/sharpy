          owner quoted in the pull request body, and the plan is judged at its verification record.
        where: [build_tools/scorecard_metrics.py, docs/process/handoff-2026-11-17-arc.md]
        source: handoff-2026-11-17-arc.md section 4
        predicted: none recorded
        state: live
        outcome: unjudged
        note: >-
