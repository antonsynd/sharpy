  kind: language
  rule: '`:=` is assignment as an expression with no scope of its own: on a new name it declares a `let` in the
    block of the statement it sits in, on an existing `var` it writes, on a `let` or a parameter it is a compile
    error (inside a comprehension too), and across a function boundary it follows N6; whether the name has a value
    where it is read stays definite assignment''s. A name slot in a statement header (`for`, `with ... as`, `except
    ... as`, a `case` capture, a comprehension''s `for`) is always a new `let` for that construct''s body. Where
    either would print something other than Python does, the program is a compile error.'
  options:
  - text: assignment as an expression; a new name is a `let` of the enclosing statement's block
    chosen: true
    recommended: true
  - text: 'an inline binder is required: `if (let x := 5) > 0` (not adopted now; it can be added later)'
  - text: always a new symbol unless `nonlocal` / `global`
  - text: the name is scoped to the `if` / `while` it is written in
  basis: precedent
  laws: [R-GV, N5, N6]
  decided_by: owner
