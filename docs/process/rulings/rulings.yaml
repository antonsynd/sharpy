- id: R-RN
  date: '2026-11-24'
  issue: '#1974'
  kind: language
  rule: 'Inside `__init__`, until every field of the class has been assigned, `self` may be used only to assign
    a field, to read one already assigned, or in the chaining call (`super().__init__(...)` or `self.__init__(...)`)
    that the spec puts first: reading a field not yet assigned, calling a method or reading a property on `self`,
    and using `self` as a value (an argument, a stored or returned value, a capture in a lambda or a nested function)
    are compile errors. Programs that would have run correctly are refused too, so that a field of a non-nullable
    type is never observed as null.'
  options:
  - text: refuse every such use of `self` until all fields are assigned
    chosen: true
    recommended: true
  - text: 'leave it as C# does: the read sees the zeroed field'
  - text: check at run time and raise, as Python does
  recommended_note: 'the agent made no recommendation: it named this rule as an example of what closing the gap
    needs and said it rejects some correct programs. The flag sits on the chosen option.'
  basis: follows
  laws: [A3, T2]
  considered:
  - id: R-RM
    why: R-RM says every field is assigned by the end of `__init__`; this ruling covers what happens before that
      point
  decided_by: owner
  door: two-way
  breaks_running: true
  undo_breaks: false
  note: 'The owner''s words were on "refusing calls on `self` before all fields are assigned", the recorder''s
    example, with the reason that a reference type `T` is never null. These parts are the recorder''s reading
    of that and not the owner''s words: the direct read of an unassigned field; reading a property; `self` as
    an argument, a stored value, a returned value or a capture (only the argument and the lambda capture are measured);
    that the chaining call stays legal; and that the rule holds for a class whose unassigned fields are all value
    types, where the read would see `0` and not null. A departure from the run-time default (C# lets a constructor
    call a method that reads a field the constructor has not assigned yet); the defect it names is a non-nullable
    field read as null. Not ruled: a base class''s `__init__` that calls a `@virtual` or `@abstract` method which
    a derived class overrides. `super().__init__()` runs before the derived body, so the override reads the derived
    class''s fields before they are assigned (measured: it prints `True` for `self.name is None`). This ruling''s
    text does not reach that case.'
