# Findings of build_tools/check_rulings.py that wait for the owner or for a text to be brought into line.
# A ratchet: a finding not listed here fails the check, and so does a row whose finding no longer fires.
# Only charter-mark, exception-in-law, collision and invariance findings may wait here; a collision or
# invariance row also carries `where` (the case), as the check prints it. So may an owner-required
# finding about owner's words the row's lead cell does not quote, with `where: owner_words N`.
# When a question is ruled, change the records (or the law, or the charter row) and delete the row.
findings:
